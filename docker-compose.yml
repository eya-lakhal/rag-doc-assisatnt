# Usage:
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull llama3.2:3b
#   docker compose exec ollama ollama pull nomic-embed-text
#   docker compose run --rm api python -m ingest.download_docs
#   docker compose run --rm api python -m ingest.build_index
#   docker compose up -d api      ->  http://localhost:8000/docs

services:
  ollama:
    image: ollama/ollama:0.6.8
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"        # one request at a time: faster per request on CPU
      OLLAMA_KEEP_ALIVE: "1h"         # keep models loaded (loading takes minutes on CPU)
      OLLAMA_MAX_LOADED_MODELS: "2"   # LLM + embedding model side by side
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # GPU (NVIDIA + WSL2): uncomment to speed up generation.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build: .
    image: rag-doc-assistant:latest
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      TOP_K: ${TOP_K:-4}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      RAW_DIR: /app/data/raw
      INDEX_DIR: /app/data/index/default
    volumes:
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama-models:
