name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (pytest)
        run: pytest --cov=app --cov=ingest --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rag-doc-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container starts, /health answers)
        run: |
          docker run -d --name api -p 8000:8000 rag-doc-assistant:ci
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
